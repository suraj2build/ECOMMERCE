name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'

env:
  DATABASE_URL: postgresql://fcp_app:fcp_dev_password@localhost:5432/fcp_test
  REDIS_URL: redis://localhost:6379
  MEILISEARCH_HOST: http://localhost:7700
  JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-not-for-prod
  MFA_SECRET_ENCRYPTION_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
  GUEST_SESSION_SIGNING_SECRET: ci-only-guest-session-secret-not-for-prod
  NODE_ENV: test
  LOG_LEVEL: fatal

jobs:
  lint-typecheck-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fcp_app
          POSTGRES_PASSWORD: fcp_dev_password
          POSTGRES_DB: fcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fcp_app -d fcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # M10 search/discovery (ADR-0006). No --health-cmd: the distroless
      # Meilisearch image has no shell/curl to exec a healthcheck with, so
      # readiness is polled from the host instead (see "Wait for
      # Meilisearch" step below), matching how the E2E step already waits
      # on the API/storefront ports.
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth-1 clone) - the
          # gitleaks secret scan below walks commit history, not just the
          # working tree, so a secret committed and later removed in a
          # follow-up commit within this same push/PR is still caught.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7700/health && break
            sleep 1
          done

      - name: Install dependencies
        run: npm ci

      # M31 Security Hardening (5J - dependency/supply-chain). `npm ci`
      # above already enforces lockfile integrity (it fails outright on
      # any package.json/package-lock.json mismatch, never silently
      # resolves a different tree). This step is the vulnerability-audit
      # half: it fails the build on any HIGH or CRITICAL advisory in a
      # PRODUCTION dependency. The one production finding (the postcss
      # copy Next.js 15.5 pins) was fixed on 2026-10-03 with an npm
      # override to a patched postcss, so the gate is now `high`. The
      # remaining findings are confined to dev-only test/lint/build
      # tooling (vitest/vite/esbuild, eslint-config-next, tailwindcss 3's
      # chokidar/micromatch, autocannon); they print below for visibility
      # and are tracked in security/DEPENDENCY_AUDIT.md.
      - name: Dependency vulnerability audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency vulnerability audit (full tree, report only)
        run: npm audit --audit-level=moderate || true

      # M31 Security Hardening (5J) - secret scanning across the full
      # git history of this push/PR, not just the working tree, so a
      # secret committed and later removed is still caught.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action requires the workflow token for pull_request
          # scans so it can resolve the PR commit range. Contents remains
          # read-only; this grants no repository write capability.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Lint
        run: npm run lint

      # Migration-from-clean-database check (CLAUDE.md §16, acceptance/
      # m00-project-foundation.md): applies the full migration history to
      # a brand-new database, proving it's deterministic and reproducible.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to a clean database
        run: npm run db:migrate:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Next uses this value when deciding whether unbuilt dynamic
          # paths may be generated at runtime. NODE_ENV=test produces a
          # missing fallback and 404s for every future product ID.
          NODE_ENV: production
          # LR-003: test-only tag IDs so the consent banner and consent-gated
          # tags are exercised by E2E (consent.spec.ts stubs the tag scripts;
          # nothing reaches Google or Meta). Never real account IDs.
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: G-E2ETEST01
          NEXT_PUBLIC_META_PIXEL_ID: '1234567890'
        run: |
          npm run build
          node -e "const manifest = require('./apps/storefront/.next/prerender-manifest.json'); if (manifest.dynamicRoutes['/product/[styleId]']?.fallback !== null) throw new Error('PDP must permit blocking generation for every future style');"

      - name: Unit tests
        run: npm test

      - name: Read-load transport regression tests
        run: node --test test/read-load/measure.test.mjs

      # LR-005: a real S3 API server for the return-evidence storage tests
      # (S3_TEST_ENDPOINT; the suite fails rather than skips in CI without it).
      - name: Start S3-compatible test server (moto)
        run: |
          python3 -m venv /tmp/moto
          /tmp/moto/bin/pip install --quiet "moto[server]"
          (/tmp/moto/bin/moto_server -p 9100 > /tmp/moto.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:9100/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:9100/ >/dev/null

      - name: Integration tests (real Postgres + Redis)
        run: npm run test:integration --workspace=services/commerce-api
        env:
          S3_TEST_ENDPOINT: http://localhost:9100

      # Runs *after* integration tests, not before: every integration test
      # file truncates all tables (test/helpers/db.ts resetDatabase()) in
      # its own beforeAll, so seeding first would just get wiped out by the
      # first test file to run, leaving no admin user for the E2E step below
      # (a real bug, not a flake - see BUILD_PLAN.md M11 entry).
      - name: Seed test-relevant reference data
        # E2E starts from a clean database and search index: the last
        # integration file's rows (and search documents for rows earlier
        # files deleted) are not E2E fixtures, and the link/asset audit
        # would otherwise be judging leftover test data.
        run: |
          (cd packages/db && npx prisma migrate reset --force --skip-seed)
          curl -sf -X DELETE http://localhost:7700/indexes/styles || true
          npm run db:seed
        env:
          SEED_SUPER_ADMIN_EMAIL: ci-admin@example.com
          SEED_SUPER_ADMIN_PASSWORD: CiOnlyPassword123!

      - name: Provision Chromium for real browser tests
        timeout-minutes: 6
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi

      # API-level smoke check (playwright.config.ts project "api-smoke")
      # plus real-browser storefront checks (project "storefront", M09+)
      # against the production builds of both services.
      - name: E2E smoke (start API + storefront, run Playwright)
        run: |
          PORT=4000 npm run start --workspace=services/commerce-api &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 1
          done
          NODE_ENV=production PORT=3000 npm run start --workspace=apps/storefront &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && break
            sleep 1
          done
          NODE_ENV=production PORT=3001 npm run start --workspace=apps/admin &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/login && break
            sleep 1
          done
          npm run test:e2e
          LOAD_TEST_ALLOWED=test-environment LOAD_TEST_API_URL=http://localhost:4000 LOAD_TEST_STOREFRONT_URL=http://localhost:3000 node scripts/go-live-read-load.mjs
          LOAD_TEST_ALLOWED=test-environment LOAD_TEST_API_URL=http://localhost:4000 LOAD_TEST_STOREFRONT_URL=http://localhost:3000 node scripts/load-checkout-contention.mjs
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:4000'
          # The API asks the storefront to drop a cached product page and its
          # cached listings after publish/unpublish/price changes and a search
          # reindex (pdp-publish-cache.spec.ts, listing-cache.spec.ts).
          STOREFRONT_REVALIDATE_URL: 'http://localhost:3000/api/revalidate/product'
          STOREFRONT_REVALIDATE_SECRET: ci-only-storefront-revalidate-not-for-prod
          # M11: the PDP E2E spec logs in as the seeded super admin to
          # provision its own test product - must match the "Seed
          # test-relevant reference data" step's values above.
          SEED_SUPER_ADMIN_EMAIL: ci-admin@example.com
          SEED_SUPER_ADMIN_PASSWORD: CiOnlyPassword123!
          # test/e2e-storefront/loyalty.spec.ts places a real ₹12,000 COD
          # order (well above the ₹5,000 default) specifically to earn
          # more than the 100-point minimum redemption threshold at the
          # default 1-point-per-₹100 earn rate - a genuine, documented,
          # test-environment-only relaxation of this business threshold
          # (never a production value), the same one local development's
          # gitignored .env already applies. Its absence here was a real
          # gap: this E2E step failed on every CI run since M23 first
          # introduced this test, undetected because this workflow's own
          # run result was never actually checked until this fix.
          COD_MAX_ORDER_VALUE_INR: '50000'
          # M33: this E2E step runs ~10 independent storefront specs that
          # each independently log in as the SAME shared seeded super
          # admin (ci-admin@example.com above) from this ONE runner - the
          # staff-login/OTP rate limits (auth/routes.ts, keyed by
          # IP+identity) would otherwise collapse every spec's login into
          # one bucket and 429 real, legitimate E2E traffic. Never set
          # outside this one E2E-only step; unset (the default) in the
          # lint-typecheck-build-test job above, so rate-limiting.test.ts
          # still proves the real, tighter limits.
          AUTH_RATE_LIMIT_E2E_OVERRIDE_MAX: '1000'
          # LR-002: the storefront blocks indexing unless explicitly enabled.
          # E2E runs it in the production-indexing mode so seo.spec.ts checks
          # the real robots.txt and sitemap; the blocked (preview) mode is
          # covered by apps/storefront/test/seo.test.ts.
          SITE_INDEXING: enabled

      - name: Upload read-load measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-load-results
          path: |
            read-load-results.json
            checkout-contention-results.json
          if-no-files-found: ignore

  commerce-api-image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fcp_app
          POSTGRES_PASSWORD: fcp_dev_password
          POSTGRES_DB: fcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fcp_app -d fcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production API container from a clean context
        run: docker build --file infra/commerce-api.Dockerfile --tag fcp-api:ci .
      - name: Verify non-root entrypoint, imports and native Prisma database query
        run: |
          docker run --rm --network host --env DATABASE_URL --entrypoint node fcp-api:ci --input-type=module -e 'import { existsSync, readdirSync } from "node:fs"; if (!existsSync("dist/index.js")) throw new Error("Missing API entrypoint"); if (!readdirSync("../../packages/db/generated/client").some(name => name.endsWith(".so.node"))) throw new Error("Missing Prisma engine"); const { PrismaClient } = await import("@fcp/db"); await import("@fcp/config"); await import("@fcp/shared"); if (process.getuid() === 0) throw new Error("Runtime must not be root"); const client = new PrismaClient(); try { const [row] = await client.$queryRawUnsafe("SELECT 1 AS healthy"); if (row.healthy !== 1) throw new Error("Native Prisma query failed"); } finally { await client.$disconnect(); }'

  read-load-investigation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fcp_app
          POSTGRES_PASSWORD: fcp_dev_password
          POSTGRES_DB: fcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fcp_app -d fcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # M10 search/discovery (ADR-0006). No --health-cmd: the distroless
      # Meilisearch image has no shell/curl to exec a healthcheck with, so
      # readiness is polled from the host instead (see "Wait for
      # Meilisearch" step below), matching how the E2E step already waits
      # on the API/storefront ports.
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700


    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to a clean database
        run: npm run db:migrate:deploy
      - name: Build production apps
        env:
          NODE_ENV: production
        run: npm run build
      - name: Read-load transport regression tests
        run: node --test test/read-load/measure.test.mjs
      - name: Seed test-relevant reference data
        run: npm run db:seed
        env:
          SEED_SUPER_ADMIN_EMAIL: ci-admin@example.com
          SEED_SUPER_ADMIN_PASSWORD: CiOnlyPassword123!
      - name: Native read load against compiled API and production storefront
        run: |
          PORT=4000 npm run start --workspace=services/commerce-api &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 1
          done
          curl -sf http://localhost:4000/health
          LOAD_TEST_ALLOWED=test-environment LOAD_TEST_API_URL=http://localhost:4000 node scripts/provision-read-load-product.mjs
          NODE_ENV=production PORT=3000 npm run start --workspace=apps/storefront &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && break
            sleep 1
          done
          curl -sf http://localhost:3000/ >/dev/null
          LOAD_TEST_ALLOWED=test-environment LOAD_TEST_API_URL=http://localhost:4000 LOAD_TEST_STOREFRONT_URL=http://localhost:3000 node scripts/go-live-read-load.mjs
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:4000'
          SEED_SUPER_ADMIN_EMAIL: ci-admin@example.com
          SEED_SUPER_ADMIN_PASSWORD: CiOnlyPassword123!

      - name: Upload targeted read-load measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-load-investigation-results
          path: read-load-results.json
          if-no-files-found: ignore
